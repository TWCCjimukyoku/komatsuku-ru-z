<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コマ図ジェネレーター v2.51 (マルチ交差点対応・ルート赤線統一版)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght=400;700&family=Share+Tech+Mono&display=swap');

  :root {
    --bg: #f5f3ee;
    --panel: #ffffff;
    --border: #1a1a1a;
    --accent: #d9534f;
    --font-main: 'Noto Sans JP', sans-serif;
    --font-num: 'Bebas Neue', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-main); background: var(--bg); color: var(--border); padding: 20px; }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--panel); padding: 15px 20px; border: 2px solid var(--border); box-shadow: 4px 4px 0px var(--border); flex-wrap: wrap; gap: 10px; }
  h1 { font-size: 1.4rem; font-weight: 700; }
  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
  
  button { font-family: var(--font-main); font-weight: 700; padding: 8px 16px; border: 2px solid var(--border); background: #fff; cursor: pointer; box-shadow: 2px 2px 0px var(--border); transition: all 0.1s; display: inline-flex; align-items: center; gap: 5px; }
  button:hover { transform: translate(1px, 1px); box-shadow: 1px 1px 0px var(--border); }
  button:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px var(--border); }
  button.danger { background: #f9f2f2; color: var(--accent); border-color: var(--accent); box-shadow: 2px 2px 0px var(--accent); }
  button.danger:hover { box-shadow: 1px 1px 0px var(--accent); }
  button.success { background: #f2f9f2; color: #4b9c4b; border-color: #4b9c4b; box-shadow: 2px 2px 0px #4b9c4b; }
  button.success:hover { box-shadow: 1px 1px 0px #4b9c4b; }

  .table-container { background: var(--panel); border: 2px solid var(--border); box-shadow: 6px 6px 0px var(--border); overflow-x: auto; margin-bottom: 40px; }
  table { width: 100%; border-collapse: collapse; text-align: center; min-width: 800px; }
  th, td { border: 1px solid var(--border); padding: 12px; vertical-align: middle; position: relative; }
  th { background: #e2dfd8; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.1em; }

  .col-no { width: 60px; font-family: var(--font-num); font-size: 1.4rem; }
  .col-dist { width: 160px; }
  .col-dir { width: 180px; cursor: pointer; background: #faf9f6; }
  .col-dir:hover { background: #f0ede5; }
  .col-label { text-align: left; font-size: 0.95rem; }
  .col-pc { width: 110px; }
  .col-action { width: 120px; }

  .dist-box { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .dist-row { display: flex; align-items: center; width: 100%; justify-content: space-between; font-family: var(--font-mono); font-size: 1.2rem; }
  .dist-label { font-family: var(--font-main); font-size: 0.7rem; font-weight: 700; background: var(--border); color: #fff; padding: 2px 4px; border-radius: 2px; }

  .action-btn-wrap { display: flex; gap: 4px; justify-content: center; }
  .action-btn { padding: 4px 8px; font-size: 0.8rem; }

  .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 100; justify-content: center; align-items: center; }
  .modal { background: var(--panel); border: 3px solid var(--border); box-shadow: 8px 8px 0px var(--border); width: 95%; max-width: 900px; padding: 25px; display: flex; flex-direction: column; gap: 20px; max-height: 95vh; overflow-y: auto; }
  .modal-header { font-weight: 700; font-size: 1.2rem; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
  
  .modal-body { display: flex; gap: 25px; flex-wrap: wrap; }
  
  .canvas-area { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .canvas-container { border: 2px solid var(--border); background: #fff; display: inline-block; box-shadow: 3px 3px 0px var(--border); position: relative; }
  #clock-svg { cursor: crosshair; display: block; user-select: none; }
  
  .palette { border: 2px solid var(--border); background: #faf9f6; padding: 10px; display: flex; gap: 10px; width: 204px; justify-content: center; flex-wrap: wrap; box-shadow: 2px 2px 0px var(--border); }
  .palette-item { width: 36px; height: 36px; cursor: grab; background: #fff; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; user-select: none; }
  .palette-item:hover { background: #eee; }

  .edit-fields { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 280px; }
  .field-group { display: flex; flex-direction: column; gap: 4px; }
  .field-group label { font-size: 0.8rem; font-weight: 700; }
  .field-group input[type="number"], .field-group input[type="text"] { padding: 8px; border: 2px solid var(--border); font-family: var(--font-mono); font-size: 1rem; }
  .field-group input[type="range"] { width: 100%; accent-color: var(--border); }
  .range-val { font-family: var(--font-mono); font-size: 0.85rem; text-align: right; margin-top: -2px; color: #555; }
  
  .checkbox-group { display: flex; align-items: center; gap: 8px; margin: 5px 0; background: #faf9f6; padding: 8px; border: 1px solid var(--border); }
  .checkbox-group input { width: 18px; height: 18px; accent-color: var(--border); cursor: pointer; }
  .checkbox-group label { font-weight: bold; cursor: pointer; font-size: 0.9rem; }

  .sub-panel { border-left: 3px solid #666; padding-left: 12px; margin-left: 5px; display: flex; flex-direction: column; gap: 10px; }

  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; border-top: 2px solid var(--border); padding-top: 15px; margin-top: auto; }
  .delete-icon-btn { cursor: pointer; fill: #d9534f; }
  .delete-icon-btn:hover { fill: #ff0000; }
</style>
</head>
<body>

<header>
  <h1>コマ図ジェネレーター v2.51 (マルチ交差点対応)</h1>
  <div class="btn-group">
    <button onclick="undo()">元に戻す</button>
    <button onclick="exportJSON()">JSON出力</button>
    <button onclick="importJSON()">JSON入力</button>
    <button class="success" onclick="publishMobileHTML()">モバイル版パブリッシュ</button>
    <button class="danger" onclick="clearData()">全クリア</button>
  </div>
</header>

<div class="table-container">
  <table id="komazu-table">
    <thead>
      <tr>
        <th class="col-no">No</th>
        <th class="col-dist">Distance (km)</th>
        <th class="col-dir">Direction</th>
        <th class="col-label">Information / Label</th>
        <th class="col-pc">ペース管理</th>
        <th class="col-action">操作</th>
      </tr>
    </thead>
    <tbody id="komazu-body"></tbody>
  </table>
</div>

<div id="edit-overlay" class="overlay" onclick="if(event.target===this) closeEditPanel()">
  <div class="modal">
    <div class="modal-header">コマ No.<span id="modal-no-title"></span> の編集</div>
    <div class="modal-body">
      
      <div class="canvas-area">
        <div class="canvas-container" id="svg-container" ondragover="allowDrop(event)" ondrop="dropIcon(event)">
          <svg id="clock-svg" width="240" height="240" viewBox="0 0 200 200" onclick="handleSvgClick(event)">
            <circle cx="100" cy="100" r="90" fill="none" stroke="#ddd" stroke-dasharray="4,4"/>
            <circle cx="100" cy="100" r="45" fill="none" stroke="#eee" stroke-dasharray="2,2"/>
            
            <line id="svg-entry-line" x1="100" y1="200" x2="100" y2="100" stroke="#d9534f" stroke-width="14" stroke-linecap="round" />
            <line id="svg-link-line" x1="100" y1="100" x2="100" y2="100" stroke="#d9534f" stroke-width="14" stroke-linecap="round" style="display:none;"/>
            <g id="svg-roads-group"></g>
            
            <circle id="svg-center-point" cx="100" cy="100" r="5" fill="#1a1a1a"/>
            <circle id="svg-center-point2" cx="100" cy="100" r="5" fill="#1a1a1a" style="display:none;"/>
            
            <g id="svg-icons-group"></g>
          </svg>
        </div>
        
        <div class="palette">
          <div class="palette-item" draggable="true" ondragstart="drag(event, 'stop')" title="とまれ">
            <svg width="24" height="24" viewBox="0 0 24 24"><polygon points="12,22 2,4 22,4" fill="#d9534f"/><polygon points="12,19 4,6 20,6" fill="#fff"/></svg>
          </div>
          <div class="palette-item" draggable="true" ondragstart="drag(event, 'one-way')" title="一方通行">
            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" fill="#337ab7" rx="2"/><polygon points="12,4 6,11 10,11 10,20 14,20 14,11 18,11" fill="#fff"/></svg>
          </div>
          <div class="palette-item" draggable="true" ondragstart="drag(event, 'signal')" title="信号機 (S)">
            <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fff" stroke="#4b9c4b" stroke-width="3"/><text x="12" y="16.5" font-family="sans-serif" font-weight="bold" font-size="13" fill="#4b9c4b" text-anchor="middle">S</text></svg>
          </div>
          <div class="palette-item" draggable="true" ondragstart="drag(event, 'railway')" title="踏切">
            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" fill="#f0ad4e" rx="2"/><line x1="2" y1="2" x2="22" y2="22" stroke="#000" stroke-width="3"/><line x1="22" y1="2" x2="2" y2="22" stroke="#000" stroke-width="3"/></svg>
          </div>
          <div class="palette-item" draggable="true" ondragstart="drag(event, 'route')" title="国道（おにぎり）">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12,2 C17,2 21,7 19,16 C18,20 15,22 12,22 C9,22 6,20 5,16 C3,7 7,2 12,2 Z" fill="#337ab7"/><text x="12" y="15" font-family="sans-serif" font-size="8" fill="#fff" text-anchor="middle">R</text></svg>
          </div>
          <div class="palette-item" draggable="true" ondragstart="drag(event, 'signboard')" title="簡易青看板">
            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" fill="#337ab7" rx="2"/><rect x="4" y="6" width="16" height="12" fill="none" stroke="#fff" stroke-width="1"/></svg>
          </div>
        </div>
      </div>

      <div class="edit-fields">
        <div style="display: flex; gap: 10px;">
          <div class="field-group" style="flex:1;">
            <label>区間距離 (Part)</label>
            <input type="number" id="ep-part" step="0.01" min="0">
          </div>
          <div class="field-group" style="flex:1;">
            <label>総距離 (Total)</label>
            <input type="number" id="ep-total" step="0.01" min="0">
          </div>
        </div>
        
        <div style="background: #fff; padding: 8px; border: 1px dashed #bbb;">
          <strong>第一原点 (通常交差点) の位置調整:</strong>
          <div style="display: flex; gap: 15px; margin-top: 5px;">
            <div class="field-group" style="flex: 1;">
              <label>左右位置 (X)</label>
              <input type="range" id="ep-offsetX" min="-50" max="50" step="5" value="0" oninput="handleOffsetChange()">
              <div class="range-val" id="ep-offsetX-val">0</div>
            </div>
            <div class="field-group" style="flex: 1;">
              <label>上下位置 (Y)</label>
              <input type="range" id="ep-offsetY" min="-50" max="50" step="5" value="0" oninput="handleOffsetChange()">
              <div class="range-val" id="ep-offsetY-val">0</div>
            </div>
          </div>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="ep-use-v2" onchange="toggleV2Panel()">
          <label for="ep-use-v2">第二原点（マルチ交差点・F字など）を有効にする</label>
        </div>

        <div id="v2-sub-panel" class="sub-panel" style="display: none; background: #fff; padding: 8px; border: 1px dashed #999;">
          <strong>第二原点（追加の接続先）の位置調整:</strong>
          <div style="display: flex; gap: 15px; margin-top: 5px;">
            <div class="field-group" style="flex: 1;">
              <label>第二 左右位置 (X2)</label>
              <input type="range" id="ep-offsetX2" min="-50" max="50" step="5" value="0" oninput="handleOffsetChange()">
              <div class="range-val" id="ep-offsetX2-val">0</div>
            </div>
            <div class="field-group" style="flex: 1;">
              <label>第二 上下位置 (Y2)</label>
              <input type="range" id="ep-offsetY2" min="-70" max="30" step="5" value="-40" oninput="handleOffsetChange()">
              <div class="range-val" id="ep-offsetY2-val">-40</div>
            </div>
          </div>
          <span style="font-size:0.75rem; color:#666;">※時計盤をクリックすると、近い方の中心点に対して道が追加されます。</span>
        </div>

        <div class="field-group">
          <label>テキスト情報 / メモ</label>
          <input type="text" id="ep-memo" placeholder="セブンイレブンを右、など">
        </div>
        <div id="placed-icons-list" style="margin-top:5px; font-size:0.85rem;">
          <strong>配置済み標識テキスト入力:</strong>
          <div id="icon-inputs-area" style="display:flex; flex-direction:column; gap:6px; margin-top:5px;"></div>
        </div>
      </div>
      
    </div>
    <div class="modal-footer">
      <button onclick="closeEditPanel()">キャンセル</button>
      <button onclick="confirmEdit()" style="background:#e2dfd8;">確定</button>
    </div>
  </div>
</div>

<script>
  let komazuRows = [];
  try {
    const loadedData = localStorage.getItem('komazuData_v2.5');
    if (loadedData) komazuRows = JSON.parse(loadedData);
  } catch(e) {
    console.error(e);
  }

  if (!Array.isArray(komazuRows) || komazuRows.length === 0) {
    komazuRows = [
      { id: 1, total: 0, part: 0, memo: 'START地点', pcType: 'none', direction: { mainAngle: null, branches: [], icons: [], offsetX: 0, offsetY: 0, useV2: false, offsetX2: 0, offsetY2: -40, branches2: [], mainAngle2: null } },
      { id: 2, total: 0, part: 0, memo: 'GOAL地点', pcType: 'none', direction: { mainAngle: null, branches: [], icons: [], offsetX: 0, offsetY: 0, useV2: false, offsetX2: 0, offsetY2: -40, branches2: [], mainAngle2: null } }
    ];
  }

  // 構造の正規化・初期化
  komazuRows.forEach(row => {
    row.total = Number(row.total) || 0;
    row.part = Number(row.part) || 0;
    if (!row.memo) row.memo = '';
    if (!row.pcType) row.pcType = 'none';
    if (!row.direction) row.direction = {};
    
    // 原点1
    if (row.direction.offsetX === undefined) row.direction.offsetX = 0;
    if (row.direction.offsetY === undefined) row.direction.offsetY = 0;
    if (!Array.isArray(row.direction.branches)) row.direction.branches = [];
    if (row.direction.mainAngle === undefined) row.direction.mainAngle = null;
    if (!Array.isArray(row.direction.icons)) row.direction.icons = [];
    
    // 原点2（マルチ交差点用）
    if (row.direction.useV2 === undefined) row.direction.useV2 = false;
    if (row.direction.offsetX2 === undefined) row.direction.offsetX2 = 0;
    if (row.direction.offsetY2 === undefined) row.direction.offsetY2 = -40;
    if (!Array.isArray(row.direction.branches2)) row.direction.branches2 = [];
    if (row.direction.mainAngle2 === undefined) row.direction.mainAngle2 = null;
  });

  let historyStack = [];
  let editTargetIdx = null;
  
  // 編集中のローカル一時ステート
  let localBranchState = []; 
  let thisMainAngle = null;
  let localBranchState2 = [];
  let thisMainAngle2 = null;
  let localIconState = [];
  let localOffsetX = 0; let localOffsetY = 0;
  let localUseV2 = false;
  let localOffsetX2 = 0; let localOffsetY2 = -40;

  function saveHistory() {
    if (historyStack.length >= 20) historyStack.shift();
    historyStack.push(JSON.stringify(komazuRows));
  }

  function undo() {
    if (historyStack.length === 0) { alert('これ以上戻せません。'); return; }
    komazuRows = JSON.parse(historyStack.pop());
    renderTable();
  }

  function recalculateDistances() {
    for (let i = 0; i < komazuRows.length; i++) {
      let p = Number(komazuRows[i].part) || 0;
      if (i === 0) {
        let t = Number(komazuRows[i].total) || 0;
        komazuRows[i].total = Math.max(0, t);
        komazuRows[i].part = 0.00;
      } else {
        let prevT = Number(komazuRows[i-1].total) || 0;
        komazuRows[i].total = parseFloat((prevT + p).toFixed(2));
        komazuRows[i].part = p;
      }
    }
  }

  function generateCompleteSvg(dirObj, isMobileBuild) {
    const size = isMobileBuild ? 160 : 100;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", size);
    svg.setAttribute("height", size);
    svg.setAttribute("viewBox", "0 0 200 200");
    
    if (!dirObj) return svg;

    const ox1 = Number(dirObj.offsetX) || 0; const oy1 = Number(dirObj.offsetY) || 0;
    const cx1 = 100 + ox1; const cy1 = 100 + oy1;
    const useV2 = !!dirObj.useV2;
    const ox2 = Number(dirObj.offsetX2) || 0; const oy2 = Number(dirObj.offsetY2) || 0;
    const cx2 = 100 + ox2; const cy2 = 100 + oy2;

    // 1. 進入路 (第一原点へ)
    const entry = document.createElementNS("http://www.w3.org/2000/svg", "line");
    entry.setAttribute("x1", "100"); entry.setAttribute("y1", "200");
    entry.setAttribute("x2", cx1); entry.setAttribute("y2", cy1);
    entry.setAttribute("stroke", "#d9534f"); entry.setAttribute("stroke-width", "14");
    entry.setAttribute("stroke-linecap", "round");
    svg.appendChild(entry);
    
    // 2. 第二原点への連絡路を描画 (v2.51 色を#777から進入線と同じ#d9534fにし、幅を14に統一)
    if (useV2) {
      const linkLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
      linkLine.setAttribute("x1", cx1); linkLine.setAttribute("y1", cy1);
      linkLine.setAttribute("x2", cx2); linkLine.setAttribute("y2", cy2);
      linkLine.setAttribute("stroke", "#d9534f"); linkLine.setAttribute("stroke-width", "14");
      linkLine.setAttribute("stroke-linecap", "round");
      svg.appendChild(linkLine);
    }

    // 3. 第一原点の分岐
    if (Array.isArray(dirObj.branches)) {
      dirObj.branches.forEach(br => {
        const rad = (br.angle * Math.PI) / 180;
        const x2 = cx1 + 90 * Math.cos(rad); const y2 = cy1 + 90 * Math.sin(rad);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", cx1); line.setAttribute("y1", cy1);
        line.setAttribute("x2", x2); line.setAttribute("y2", y2);
        line.setAttribute("stroke-linecap", "round");
        
        if (br.angle === dirObj.mainAngle) {
          line.setAttribute("stroke", "#d9534f"); line.setAttribute("stroke-width", "14");
          svg.appendChild(line);
          appendArrowHead(svg, cx1, cy1, rad);
        } else {
          line.setAttribute("stroke", "#1a1a1a"); line.setAttribute("stroke-width", "5");
          svg.appendChild(line);
        }
      });
    }

    // 4. 第二原点の分岐
    if (useV2 && Array.isArray(dirObj.branches2)) {
      dirObj.branches2.forEach(br => {
        const rad = (br.angle * Math.PI) / 180;
        const x2 = cx2 + 90 * Math.cos(rad); const y2 = cy2 + 90 * Math.sin(rad);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", cx2); line.setAttribute("y1", cy2);
        line.setAttribute("x2", x2); line.setAttribute("y2", y2);
        line.setAttribute("stroke-linecap", "round");
        
        if (br.angle === dirObj.mainAngle2) {
          line.setAttribute("stroke", "#d9534f"); line.setAttribute("stroke-width", "14");
          svg.appendChild(line);
          appendArrowHead(svg, cx2, cy2, rad);
        } else {
          line.setAttribute("stroke", "#1a1a1a"); line.setAttribute("stroke-width", "5");
          svg.appendChild(line);
        }
      });
    }

    // 5. 原点マーク
    const c1 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c1.setAttribute("cx", cx1); c1.setAttribute("cy", cy1); c1.setAttribute("r", "5"); c1.setAttribute("fill", "#1a1a1a");
    svg.appendChild(c1);

    if (useV2) {
      const c2 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c2.setAttribute("cx", cx2); c2.setAttribute("cy", cy2); c2.setAttribute("r", "5"); c2.setAttribute("fill", "#1a1a1a");
      svg.appendChild(c2);
    }

    // 6. 標識アイコン
    if (Array.isArray(dirObj.icons)) {
      dirObj.icons.forEach(ic => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("transform", `translate(${ic.x - 15}, ${ic.y - 15})`);
        
        let bg = "";
        if (ic.type === 'signal') bg = `<circle cx="15" cy="15" r="12" fill="#fff"/>`;
        else if (ic.type === 'stop') bg = `<polygon points="15,28 1,4 29,4" fill="#fff"/>`;
        else if (ic.type === 'one-way' || ic.type === 'route' || ic.type === 'signboard') bg = `<rect x="1" y="1" width="28" height="28" fill="#fff" rx="2"/>`;

        if (ic.type === 'stop') {
          g.innerHTML = bg + `<polygon points="15,28 2,5 28,5" fill="#d9534f"/><polygon points="15,24 5,7 25,7" fill="#fff"/>`;
        } else if (ic.type === 'one-way') {
          g.innerHTML = bg + `<rect x="4" y="2" width="22" height="26" fill="#337ab7" rx="2"/><polygon points="15,4 7,12 12,12 12,24 18,24 18,12 23,12" fill="#fff"/>`;
        } else if (ic.type === 'signal') {
          g.innerHTML = bg + `<circle cx="15" cy="15" r="12" fill="#fff" stroke="#4b9c4b" stroke-width="3"/><text x="15" y="20" font-family="sans-serif" font-weight="bold" font-size="14" fill="#4b9c4b" text-anchor="middle">S</text>`;
        } else if (ic.type === 'railway') {
          g.innerHTML = `<rect x="2" y="2" width="26" height="26" fill="#f0ad4e" rx="2"/><line x1="2" y1="2" x2="28" y2="28" stroke="#000" stroke-width="3"/><line x1="28" y1="2" x2="2" y2="28" stroke="#000" stroke-width="3"/>`;
        } else if (ic.type === 'route') {
          g.innerHTML = bg + `<path d="M15,2 C22,2 27,8 25,20 C23,25 19,28 15,28 C11,28 7,25 5,20 C3,8 8,2 15,2 Z" fill="#337ab7"/><text x="15" y="18" font-family='sans-serif' font-weight='bold' font-size='9' fill='#fff' text-anchor='middle'>${ic.text||''}</text>`;
        } else if (ic.type === 'signboard') {
          g.innerHTML = bg + `<rect x="0" y="4" width="30" height="22" fill="#337ab7" rx="2"/><rect x="2" y="6" width="26" height="18" fill="none" stroke="#fff" stroke-width="1"/><text x="15" y="18" font-family='sans-serif' font-size='7' fill='#fff' text-anchor='middle'>${ic.text||''}</text>`;
        }
        svg.appendChild(g);
      });
    }

    return svg;
  }

  function appendArrowHead(svg, cx, cy, rad) {
    const arrow = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    const ax = cx + 95 * Math.cos(rad); const ay = cy + 95 * Math.sin(rad);
    const p1x = ax + 14 * Math.cos(rad + (Math.PI*5/6)); const p1y = ay + 14 * Math.sin(rad + (Math.PI*5/6));
    const p2x = ax + 14 * Math.cos(rad - (Math.PI*5/6)); const p2y = ay + 14 * Math.sin(rad - (Math.PI*5/6));
    arrow.setAttribute("points", `${ax},${ay} ${p1x},${p1y} ${p2x},${p2y}`);
    arrow.setAttribute("fill", "#d9534f");
    svg.appendChild(arrow);
  }

  function renderTable() {
    const tbody = document.getElementById('komazu-body');
    if (!tbody) return;
    tbody.innerHTML = '';

    komazuRows.forEach((row, idx) => {
      const tr = document.createElement('tr');

      const tdNo = document.createElement('td');
      tdNo.className = 'col-no'; tdNo.textContent = idx + 1;
      tr.appendChild(tdNo);

      const t = Number(row.total) || 0; const p = Number(row.part) || 0;
      const tdDist = document.createElement('td');
      tdDist.className = 'col-dist';
      tdDist.innerHTML = `
        <div class="dist-box">
          <div class="dist-row"><span class="dist-label">TOTAL</span><span>${t.toFixed(2)}</span></div>
          <div class="dist-row"><span class="dist-label">PART</span><span>${p.toFixed(2)}</span></div>
        </div>
      `;
      tr.appendChild(tdDist);

      const tdDir = document.createElement('td');
      tdDir.className = 'col-dir';
      tdDir.onclick = () => openEditPanel(idx);
      
      const miniSvg = generateCompleteSvg(row.direction, false);
      tdDir.appendChild(miniSvg);
      tr.appendChild(tdDir);

      const tdLabel = document.createElement('td');
      tdLabel.className = 'col-label'; tdLabel.textContent = row.memo || '';
      tr.appendChild(tdLabel);

      tdPc.className = 'col-pc';
      const select = document.createElement('select');
      select.style.padding = "4px";
      select.innerHTML = `
        <option value="none" ${row.pcType==='none'?'selected':''}>通常</option>
        <option value="start" ${row.pcType==='start'?'selected':''}>PCスタート</option>
        <option value="goal" ${row.pcType==='goal'?'selected':''}>PCゴール</option>
      `;
      select.onchange = (e) => {
        saveHistory();
        row.pcType = e.target.value;
        localStorage.setItem('komazuData_v2.5', JSON.stringify(komazuRows));

      tdPc.appendChild(select);
      tr.appendChild(tdPc);

      total: 0, part: 0.00, memo: '', pcType: 'none',

    });

      saveHistory(); komazuRows.splice(idx, 1);

  function drag(ev, type) { ev.dataTransfer.setData("text/plain", type); }
  function allowDrop(ev) { ev.preventDefault(); }
  
  function dropIcon(ev) {
    ev.preventDefault();

  function openEditPanel(idx) {
    editTargetIdx = idx;
    const row = komazuRows[idx];

    // ステートのコピー

    thisMainAngle2 = row.direction.mainAngle2;
    localIconState = JSON.parse(JSON.stringify(row.direction.icons || []));
    
    localOffsetX = row.direction.offsetX || 0;
    localOffsetY = row.direction.offsetY || 0;
    localUseV2 = !!row.direction.useV2;

  // 時計盤クリック時の振り分けロジック
  function handleSvgClick(event) {
    const svg = document.getElementById('clock-svg');
    const pt = svg.createSVGPoint();
    pt.x = event.clientX; pt.y = event.clientY;
    const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
    
    const cx1 = 100 + localOffsetX; const cy1 = 100 + localOffsetY;
    const cx2 = 100 + localOffsetX2; const cy2 = 100 + localOffsetY2;

    // クリック位置から原点1と原点2への距離を計算
    const distToV1 = Math.sqrt((svgP.x - cx1)**2 + (svgP.y - cy1)**2);
    const distToV2 = Math.sqrt((svgP.x - cx2)**2 + (svgP.y - cy2)**2);

    // 中心点そのもののクリックは無視
    if (distToV1 < 12 || (localUseV2 && distToV2 < 12)) return;

    // 第二原点が有効かつ、第二原点の方がクリック位置に近い場合は「第二原点の交差点」を編集
    if (localUseV2 && distToV2 < distToV1) {
      let angle = Math.atan2(svgP.y - cy2, svgP.x - cx2) * 180 / Math.PI;
      angle = Math.round(angle / 15) * 15; if (angle < 0) angle += 360;

      const existingIdx = localBranchState2.findIndex(b => Math.abs(b.angle - angle) < 5);
      if (existingIdx !== -1) {
        if (thisMainAngle2 === localBranchState2[existingIdx].angle) {
          thisMainAngle2 = null; localBranchState2.splice(existingIdx, 1);
        } else {
          thisMainAngle2 = localBranchState2[existingIdx].angle;
        }
      } else {
        localBranchState2.push({ angle: angle });
      }
    } else {
      // 通常の第一原点側の処理
      let angle = Math.atan2(svgP.y - cy1, svgP.x - cx1) * 180 / Math.PI;
      angle = Math.round(angle / 15) * 15; if (angle < 0) angle += 360;

      const existingIdx = localBranchState.findIndex(b => Math.abs(b.angle - angle) < 5);
      if (existingIdx !== -1) {
        if (thisMainAngle === localBranchState[existingIdx].angle) {
          thisMainAngle = null; localBranchState.splice(existingIdx, 1);
        } else {
          thisMainAngle = localBranchState[existingIdx].angle;
        }
      } else {
        localBranchState.push({ angle: angle });
      }
    }
    renderClockSvg();
  }

  function renderClockSvg() {
    const cx1 = 100 + localOffsetX; const cy1 = 100 + localOffsetY;
    const cx2 = 100 + localOffsetX2; const cy2 = 100 + localOffsetY2;

    // 進入路更新
    const entryLine = document.getElementById('svg-entry-line');
    if(entryLine) { entryLine.setAttribute("x2", cx1); entryLine.setAttribute("y2", cy1); }

    // 連絡路更新 (v2.51 属性更新と同時に太さを14に設定)
    const linkLine = document.getElementById('svg-link-line');
    if(linkLine) {
      linkLine.setAttribute("x1", cx1); linkLine.setAttribute("y1", cy1);
      linkLine.setAttribute("x2", cx2); linkLine.setAttribute("y2", cy2);
      linkLine.setAttribute("stroke-width", "14");
    }

    const rGroup = document.getElementById('svg-roads-group');
    if(!rGroup) return;
    rGroup.innerHTML = '';
    
    // 原点1 分岐路描画
    localBranchState.forEach(br => {
      const rad = (br.angle * Math.PI) / 180;
      const x2 = cx1 + 90 * Math.cos(rad); const y2 = cy1 + 90 * Math.sin(rad);
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", cx1); line.setAttribute("y1", cy1);
      line.setAttribute("x2", x2); line.setAttribute("y2", y2);
      line.setAttribute("stroke-linecap", "round");

      if (br.angle === thisMainAngle) {
        line.setAttribute("stroke", "#d9534f"); line.setAttribute("stroke-width", "14");
        rGroup.appendChild(line);
        appendArrowHead(rGroup, cx1, cy1, rad);
      } else {
        line.setAttribute("stroke", "#1a1a1a"); line.setAttribute("stroke-width", "5");
        rGroup.appendChild(line);
      }
    });

    // 原点2 分岐路描画
    if (localUseV2) {
      localBranchState2.forEach(br => {
        const rad = (br.angle * Math.PI) / 180;
        const x2 = cx2 + 90 * Math.cos(rad); const y2 = cy2 + 90 * Math.sin(rad);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", cx2); line.setAttribute("y1", cy2);
        line.setAttribute("x2", x2); line.setAttribute("y2", y2);
        line.setAttribute("stroke-linecap", "round");

        if (br.angle === thisMainAngle2) {
          line.setAttribute("stroke", "#d9534f"); line.setAttribute("stroke-width", "14");
          rGroup.appendChild(line);
          appendArrowHead(rGroup, cx2, cy2, rad);
        } else {
          line.setAttribute("stroke", "#1a1a1a"); line.setAttribute("stroke-width", "5");
          rGroup.appendChild(line);
        }
      });
    }

    // 中心点位置固定
    const centerPt = document.getElementById('svg-center-point');
    if(centerPt) { centerPt.setAttribute("cx", cx1); centerPt.setAttribute("cy", cy1); }
    const centerPt2 = document.getElementById('svg-center-point2');
    if(centerPt2) { centerPt2.setAttribute("cx", cx2); centerPt2.setAttribute("cy", cy2); }

    // 標識再配置
    const iGroup = document.getElementById('svg-icons-group');
    if(!iGroup) return;
    iGroup.innerHTML = '';
    localIconState.forEach((ic, index) => {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("transform", `translate(${ic.x - 15}, ${ic.y - 15})`);
      g.style.cursor = 'pointer';
      g.onclick = (e) => { e.stopPropagation(); deleteIcon(index); };
      
      let bg = "";
      if (ic.type === 'signal') bg = `<circle cx="15" cy="15" r="12" fill="#fff"/>`;
      else if (ic.type === 'stop') bg = `<polygon points="15,28 1,4 29,4" fill="#fff"/>`;
      else if (ic.type === 'one-way' || ic.type === 'route' || ic.type === 'signboard') bg = `<rect x="1" y="1" width="28" height="28" fill="#fff" rx="2"/>`;

      if (ic.type === 'stop') {
        g.innerHTML = bg + `<polygon points="15,28 2,5 28,5" fill="#d9534f"/><polygon points="15,24 5,7 25,7" fill="#fff"/>`;
      } else if (ic.type === 'one-way') {
        g.innerHTML = bg + `<rect x="4" y="2" width="22" height="26" fill="#337ab7" rx="2"/><polygon points="15,4 7,12 12,12 12,24 18,24 18,12 23,12" fill="#fff"/>`;
      } else if (ic.type === 'signal') {
        g.innerHTML = bg + `<circle cx="15" cy="15" r="12" fill="#fff" stroke="#4b9c4b" stroke-width="3"/><text x="15" y="20" font-family="sans-serif" font-weight="bold" font-size="14" fill="#4b9c4b" text-anchor="middle">S</text>`;
      } else if (ic.type === 'railway') {
        g.innerHTML = `<rect x="2" y="2" width="26" height="26" fill="#f0ad4e" rx="2"/><line x1="2" y1="2" x2="28" y2="28" stroke="#000" stroke-width="3"/><line x1="28" y1="2" x2="2" y2="28" stroke="#000" stroke-width="3"/>`;
      } else if (ic.type === 'route') {
        g.innerHTML = bg + `<path d="M15,2 C22,2 27,8 25,20 C23,25 19,28 15,28 C11,28 7,25 5,20 C3,8 8,2 15,2 Z" fill="#337ab7"/><text x="15" y="18" font-family='sans-serif' font-weight='bold' font-size='9' fill='#fff' text-anchor='middle'>${ic.text||''}</text>`;
      } else if (ic.type === 'signboard') {
        g.innerHTML = bg + `<rect x="0" y="4" width="30" height="22" fill="#337ab7" rx="2"/><rect x="2" y="6" width="26" height="18" fill="none" stroke="#fff" stroke-width="1"/><text x="15" y="18" font-family='sans-serif' font-size='7' fill='#fff' text-anchor='middle'>${ic.text||''}</text>`;
      }
      
      const delMark = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      delMark.setAttribute("cx", "28"); delMark.setAttribute("cy", "2"); delMark.setAttribute("r", "5");
      delMark.setAttribute("class", "delete-icon-btn");
      g.appendChild(delMark);

      iGroup.appendChild(g);
    });
  }

  function deleteIcon(idx) { localIconState.splice(idx, 1); renderClockSvg(); renderIconInputs(); }

  function renderIconInputs() {
    const area = document.getElementById('icon-inputs-area');

  function exportJSON() {
    const blob = new Blob([JSON.stringify(komazuRows, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = "komazu_route_v2.51.json"; a.click();
  }

  function importJSON() {
    const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
    input.onchange = e => {
      const reader = new FileReader();
      reader.onload = event => {
        try {
          komazuRows = JSON.parse(event.target.result);
          komazuRows.forEach(row => {
            row.total = Number(row.total) || 0; row.part = Number(row.part) || 0;
            if (!row.memo) row.memo = '';
            if (!row.pcType) row.pcType = 'none';
            if (!row.direction) row.direction = {};
            if (row.direction.offsetX === undefined) row.direction.offsetX = 0;
            if (row.direction.offsetY === undefined) row.direction.offsetY = 0;
            if (!Array.isArray(row.direction.branches)) row.direction.branches = [];
            if (!Array.isArray(row.direction.icons)) row.direction.icons = [];
            if (row.direction.useV2 === undefined) row.direction.useV2 = false;
            if (row.direction.offsetX2 === undefined) row.direction.offsetX2 = 0;
            if (row.direction.offsetY2 === undefined) row.direction.offsetY2 = -40;
            if (!Array.isArray(row.direction.branches2)) row.direction.branches2 = [];
          });
          recalculateDistances(); renderTable();
        } catch(err) { alert('読み込みに失敗しました。'); }
      };
      reader.readAsText(e.target.files[0]);
    };
    input.click();
  }
